<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikepaths Travels Archive</title>
  <meta name="description" content="Public archives of travels logs, channels, and records from @bikepaths.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Travels Portal</h1>
        <p>Public Dialogue Archive Directory</p>
      </div>
      
      <div class="target-list" id="target-list">
        <!-- JS filled -->
      </div>
    </aside>

    <!-- Main Chat Feed Area -->
    <main class="main-view">
      <header class="chat-header">
        <div class="chat-info">
          <h2 id="chat-title">Select an Archive</h2>
          <p id="chat-subtitle">Telegram logs</p>
        </div>
        
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search conversations...">
        </div>
      </header>

      <!-- Message History List -->
      <section class="message-feed" id="message-feed">
        <!-- JS filled -->
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
